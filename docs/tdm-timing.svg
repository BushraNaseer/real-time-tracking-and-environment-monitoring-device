<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="Arial,sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="760" height="260" fill="#fff"/>
<text x="380" y="24" text-anchor="middle" font-size="16" font-weight="bold">TDM duty cycle: one 60 s frame</text>
<text x="40" y="95">Node 1</text><text x="40" y="165">Node 2</text>
<!-- frame 60s = 600px from x=110 -->
<rect x="110" y="75" width="600" height="30" fill="#d7e3f4" stroke="#334"/>
<rect x="110" y="75" width="50" height="30" fill="#e8a33d" stroke="#334"/>
<rect x="110" y="145" width="600" height="30" fill="#d7e3f4" stroke="#334"/>
<rect x="160" y="145" width="50" height="30" fill="#e8a33d" stroke="#334"/>
<text x="135" y="95" text-anchor="middle" font-size="11">TX 5 s</text>
<text x="185" y="165" text-anchor="middle" font-size="11">TX 5 s</text>
<text x="435" y="95" text-anchor="middle">RX 55 s</text><text x="460" y="165" text-anchor="middle">RX 55 s</text>
<g stroke="#334"><line x1="110" y1="190" x2="710" y2="190"/><line x1="110" y1="185" x2="110" y2="195"/><line x1="160" y1="185" x2="160" y2="195"/><line x1="210" y1="185" x2="210" y2="195"/><line x1="710" y1="185" x2="710" y2="195"/></g>
<g font-size="11" text-anchor="middle"><text x="110" y="210">0 s</text><text x="160" y="210">5 s</text><text x="210" y="210">10 s</text><text x="710" y="210">60 s</text></g>
<text x="380" y="240" text-anchor="middle" font-size="11" fill="#a33">Slot offset of Node 2 is illustrative. TO CONFIRM how nodes are assigned slots and kept in sync.</text>
</svg>
